<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spectral — шрифт</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="site">
  <header class="header">
    <img class="design" src="images/header.svg" alt="Витрина оптики с рядами очков">
  </header>

  <section class="recipe">
    <img class="design" src="images/recipe.svg" alt="Декоративные буквы вокруг рецепта">
    <div class="paper">
      <h2>РЕЦЕПТ НА ОЧКИ<br>SPECTRAL</h2>
      <ol>
        <li>Для постоянного ношения</li>
        <li>Для дали</li>
        <li>Гротеск</li>
        <li>Антиква</li>
        <li>Для близи</li>
        <li>Для чтения с больших экранов</li>
        <li>Для работы в Google документах и таблицах</li>
      </ol>

      <img src="images/prescription-circles.png" alt="Рукописные обводки пунктов" class="recipe-circles">

      <div class="prescription-block">
        <p class="field-left first-field">Прав. сфера</p>
        <p class="field-left second-field">Лев. сфера</p>
        <img src="images/prescription-values.png" alt="Рукописные значения, линии, цилиндр и ось" class="recipe-values">
      </div>

      <p class="credits">Заказчик: Google<br>Изготовитель: Production Type</p>
    </div>
  </section>

  <section class="history">
    <img class="design" src="images/history.svg" alt="История Spectral и образцы шрифта party">
  </section>

  <section class="about">
    <img class="design" src="images/about.svg" alt="О шрифте: 385 языков, 1221 глиф, 14 начертаний и настройки линзы">
  </section>

  <footer class="anatomy">
    <img class="design" src="images/anatomy.svg" alt="Анатомия букв Spectral и информация об авторе">
  </footer>
</main>
</body>
</html>
